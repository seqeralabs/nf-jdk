name: Build jemalloc binaries
on:
  push:
    branches:
      - '*'
    paths:
      - 'build-jemalloc-native.sh'
      - '.github/workflows/build-jemalloc.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-jemalloc-amd64:
    name: Build jemalloc for AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl bzip2
        
    - name: Build jemalloc for AMD64
      run: ./build-jemalloc-native.sh amd64
      
    - name: Upload AMD64 artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
      with:
        name: jemalloc-amd64
        path: jemalloc-binaries/amd64/
        retention-days: 1

