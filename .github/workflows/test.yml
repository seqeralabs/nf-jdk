name: nf-jdk test
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'Makefile'
      - 'VERSION'
      - 'install-jemalloc.sh'
      - 'wait-for-it.sh'
      - 'tests/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  id-token: write

jobs:
  get-versions:
    name: Get versions from Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
        with:
          fetch-depth: 1

      - id: versions
        run: |
          echo "versions<<EOF" >> $GITHUB_OUTPUT
          make -s print-versions >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

    outputs:
      versions: ${{ steps.versions.outputs.versions }}

  test-base:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}

    name: Test base (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
      with:
        fetch-depth: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action@v3.12.0

    # Base images are pulled through the central ECR pull-through cache of public.ecr.aws
    - name: Configure AWS credentials
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::232933512461:role/nf-jdk-ecr-thirdparty-puller
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Login to ECR pull-through cache
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Pull from public.ecr.aws (fork PR, no AWS access)
      if: ${{ github.event.pull_request.head.repo.fork }}
      run: echo "ECR_MIRROR=public.ecr.aws" >> "$GITHUB_ENV"

    - name: Build base image
      run: make build-base-local version=${{ matrix.version }}

    - name: Test base image
      run: bash tests/test-image.sh "nf-jdk:corretto-${{ matrix.version }}" base

  test-jemalloc:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}

    name: Test jemalloc (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
      with:
        fetch-depth: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action@v3.12.0

    # Base images are pulled through the central ECR pull-through cache of public.ecr.aws
    - name: Configure AWS credentials
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::232933512461:role/nf-jdk-ecr-thirdparty-puller
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Login to ECR pull-through cache
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Pull from public.ecr.aws (fork PR, no AWS access)
      if: ${{ github.event.pull_request.head.repo.fork }}
      run: echo "ECR_MIRROR=public.ecr.aws" >> "$GITHUB_ENV"

    - name: Build jemalloc image
      run: make build-jemalloc-local version=${{ matrix.version }}

    - name: Test jemalloc image
      run: bash tests/test-image.sh "nf-jdk:corretto-${{ matrix.version }}-jemalloc" jemalloc
