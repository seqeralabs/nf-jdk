name: nf-jdk test
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'Makefile'
      - 'VERSION'
      - 'install-jemalloc.sh'
      - 'wait-for-it.sh'
      - 'tests/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  get-versions:
    name: Get versions from Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
        with:
          fetch-depth: 1

      - id: versions
        run: |
          echo "versions<<EOF" >> $GITHUB_OUTPUT
          make -s print-versions >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

    outputs:
      versions: ${{ steps.versions.outputs.versions }}

  test:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}

    name: Test (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
      with:
        fetch-depth: 1

    # Pull the base image once into the local Docker daemon; both builds below use the
    # default `docker` buildx driver, which resolves FROM from local images, so the
    # registry is hit once per version instead of once per variant
    - name: Pull base image
      run: docker pull "$(make -s print-base-image version=${{ matrix.version }})"

    - name: Build base image
      run: make build-base-local version=${{ matrix.version }}

    - name: Test base image
      run: bash tests/test-image.sh "nf-jdk:corretto-${{ matrix.version }}" base

    - name: Build jemalloc image
      run: make build-jemalloc-local version=${{ matrix.version }}

    - name: Test jemalloc image
      run: bash tests/test-image.sh "nf-jdk:corretto-${{ matrix.version }}-jemalloc" jemalloc
