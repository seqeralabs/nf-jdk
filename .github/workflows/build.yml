name: nf-jdk build
on:

  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile*'
      - 'Makefile'
      - 'VERSION'
      - 'install-jemalloc.sh'
      - 'build-jemalloc.sh'
      - 'build-jemalloc-native.sh'

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

jobs:
  get-versions:
    name: Get versions from Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - id: versions
        run: |
          echo "versions<<EOF" >> $GITHUB_OUTPUT
          make -s print-versions >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

    outputs:
      versions: ${{ steps.versions.outputs.versions }}

  build-base:
    needs: get-versions
    strategy:
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}

    name: Build base container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      with:
        fetch-depth: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1

    # Base images are pulled through the central ECR pull-through cache of public.ecr.aws
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::232933512461:role/gha-thirdparty-puller
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Login to ECR pull-through cache
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action@v4.6.0
      with:
        registry: "public.cr.seqera.io"
        username: "nf-jdk-ci-admin"
        password: ${{ secrets.SEQERA_PUBLIC_CR_PASSWORD }}

    - name: Set date tag (YYYYMMDD UTC)
      run: echo "DATE_TAG=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV

    - name: Build base image
      run: make build-base version=${{ matrix.version }} DATE_TAG=${{ env.DATE_TAG }} METADATA_FILE=/tmp/build-metadata.json

    - name: Extract image digest
      id: digest
      run: |
        DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0.24.0
      with:
        image: public.cr.seqera.io/seqeralabs/nf-jdk:corretto-${{ matrix.version }}@${{ steps.digest.outputs.digest }}
        artifact-name: sbom-base-${{ matrix.version }}.spdx.json
        output-file: /tmp/sbom-base.spdx.json

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance@v4.2.2
      with:
        subject-name: public.cr.seqera.io/seqeralabs/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: true

    - name: Attest SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # actions/attest-sbom@v4.1.0
      with:
        subject-name: public.cr.seqera.io/seqeralabs/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: /tmp/sbom-base.spdx.json
        push-to-registry: true

    - name: Attest build provenance (legacy repo, deprecated)
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # actions/attest-build-provenance@v2.4.0
      with:
        subject-name: public.cr.seqera.io/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: true

    - name: Attest SBOM (legacy repo, deprecated)
      uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # actions/attest-sbom@v2.4.0
      with:
        subject-name: public.cr.seqera.io/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: /tmp/sbom-base.spdx.json
        push-to-registry: true

  build-jemalloc-container:
    needs: get-versions
    strategy:
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}

    name: Build jemalloc container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      with:
        fetch-depth: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1

    # Base images are pulled through the central ECR pull-through cache of public.ecr.aws
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::232933512461:role/gha-thirdparty-puller
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Login to ECR pull-through cache
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action@v4.6.0
      with:
        registry: "public.cr.seqera.io"
        username: "nf-jdk-ci-admin"
        password: ${{ secrets.SEQERA_PUBLIC_CR_PASSWORD }}

    - name: Set date tag (YYYYMMDD UTC)
      run: echo "DATE_TAG=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV

    - name: Build jemalloc image
      run: make build-jemalloc version=${{ matrix.version }} DATE_TAG=${{ env.DATE_TAG }} METADATA_FILE=/tmp/build-metadata.json

    - name: Extract image digest
      id: digest
      run: |
        DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0.24.0
      with:
        image: public.cr.seqera.io/seqeralabs/nf-jdk:corretto-${{ matrix.version }}-jemalloc@${{ steps.digest.outputs.digest }}
        artifact-name: sbom-jemalloc-${{ matrix.version }}.spdx.json
        output-file: /tmp/sbom-jemalloc.spdx.json

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance@v4.2.2
      with:
        subject-name: public.cr.seqera.io/seqeralabs/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: true

    - name: Attest SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # actions/attest-sbom@v4.1.0
      with:
        subject-name: public.cr.seqera.io/seqeralabs/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: /tmp/sbom-jemalloc.spdx.json
        push-to-registry: true

    - name: Attest build provenance (legacy repo, deprecated)
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # actions/attest-build-provenance@v2.4.0
      with:
        subject-name: public.cr.seqera.io/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: true

    - name: Attest SBOM (legacy repo, deprecated)
      uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # actions/attest-sbom@v2.4.0
      with:
        subject-name: public.cr.seqera.io/nf-jdk
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: /tmp/sbom-jemalloc.spdx.json
        push-to-registry: true
